name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal CI for a solo Chrome-extension project: verify a clean checkout
# builds into a valid `dist/`. Formatting is enforced locally via
# `npm run format` — not as a CI gate.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Upload unpacked extension
        uses: actions/upload-artifact@v4
        with:
          name: jsnap-unpacked
          path: dist
          retention-days: 14
