<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>JSnap offscreen</title>
  </head>
  <body>
    <script>
      // This document exists only so the service worker has access to
      // URL.createObjectURL, which is unavailable in MV3 service workers.
      // Chrome respects the `filename` option of chrome.downloads.download
      // when the URL is a blob: URL, but not always when it is a data: URL,
      // which is why the offscreen hop is necessary.
      chrome.runtime.onMessage.addListener((msg, _sender, sendResponse) => {
        if (!msg || msg.target !== 'offscreen') return false;

        if (msg.type === 'CREATE_BLOB_URL') {
          try {
            const blob = new Blob([msg.body], { type: msg.mime || 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            sendResponse({ ok: true, url });
          } catch (err) {
            sendResponse({ ok: false, error: String(err && err.message) || String(err) });
          }
          return false;
        }

        if (msg.type === 'REVOKE_BLOB_URL') {
          try {
            URL.revokeObjectURL(msg.url);
            sendResponse({ ok: true });
          } catch (err) {
            sendResponse({ ok: false, error: String(err && err.message) || String(err) });
          }
          return false;
        }

        return false;
      });
    </script>
  </body>
</html>
